name: GoldManager
options:
  bundleIdPrefix: com.phucbinh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
targets:
  GoldManager:
    type: application
    platform: iOS
    productName: Gold Manager
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Quản Lý Vàng
        EXPO_PUBLIC_SUPABASE_URL: $(EXPO_PUBLIC_SUPABASE_URL)
        EXPO_PUBLIC_SUPABASE_ANON_KEY: $(EXPO_PUBLIC_SUPABASE_ANON_KEY)
        NSAppTransportSecurity:
          NSExceptionDomains:
            btmc.vn:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.2
              NSExceptionRequiresForwardSecrecy: false
        LSApplicationCategoryType: public.app-category.finance
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleURLTypes:
          - CFBundleURLName: com.phucbinh.goldmanager
            CFBundleURLSchemes:
              - goldmanager
    dependencies:
      - target: GoldManagerWidgets
        embed: true
    preBuildScripts:
      - name: Sync Parent Env
        script: Scripts/sync-env-xcconfig.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phucbinh.goldmanager
        PRODUCT_NAME: Gold Manager
        DEVELOPMENT_TEAM: QGCQL2BU62
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
  GoldManagerWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - Widgets
      - path: Sources/Services.swift
      - path: Sources/FeatureAPI.swift
      - path: Sources/Models.swift
      - path: Sources/BudgetModels.swift
      - path: Sources/IpadModels.swift
      - path: Sources/RoomModels.swift
      - path: Sources/PersonalModels.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Gold Manager Widgets
        EXPO_PUBLIC_SUPABASE_URL: $(EXPO_PUBLIC_SUPABASE_URL)
        EXPO_PUBLIC_SUPABASE_ANON_KEY: $(EXPO_PUBLIC_SUPABASE_ANON_KEY)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phucbinh.goldmanager.widgets
        PRODUCT_NAME: GoldManagerWidgets
        DEVELOPMENT_TEAM: QGCQL2BU62
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
